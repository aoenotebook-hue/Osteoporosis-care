<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c5cab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ดูแลกระดูกพรุน">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>ดูแลกระดูกพรุน — Osteoporosis Care</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f2f6fc;
    --surface: #ffffff;
    --surface-alt: #eaf1fb;
    --text: #10161d;
    --muted: #52606d;
    --border: #d6e0ee;
    --primary: #1c5cab;
    --primary-dark: #104281;
    --primary-light: #cde2fb;
    --series-1: #2a78d6;
    --grid: #e1e6ec;
    --tier-a: #0b7a3d;
    --tier-b: #a35a08;
    --tier-c: #3a4f8a;
    --good: #0ca30c;
    --warning: #fab219;
    --warning-ink: #7a5200;
    --warning-bg: #fff6e0;
    --serious: #ec835a;
    --critical: #d03b3b;
    --critical-bg: #fdecec;
    --radius: 16px;
    --tap: 48px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Noto Sans Thai UI', 'Noto Sans Thai', 'Sarabun', -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 19px; line-height: 1.55; -webkit-tap-highlight-color: transparent;
  }
  body { padding-bottom: 88px; }
  h1, h2, h3 { line-height: 1.35; margin: 0 0 8px; }
  h1 { font-size: 1.45rem; }
  h2 { font-size: 1.2rem; }
  h3 { font-size: 1.05rem; }
  p { margin: 0 0 10px; }
  button { font: inherit; }
  a { color: var(--primary-dark); }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .center { text-align: center; }

  header.app-header {
    background: var(--primary); color: #fff; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    padding-top: calc(12px + env(safe-area-inset-top));
  }
  header .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  header .brand svg { width: 38px; height: 38px; flex-shrink: 0; border-radius: 9px; }
  header .app-name { font-size: 1.12rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lang-toggle {
    background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 16px;
    border-radius: 999px; min-height: 42px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }

  main.screen { padding: 16px; max-width: 680px; margin: 0 auto; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px;
  }
  .card.accent { border-color: var(--primary); border-width: 2px; background: var(--surface-alt); }
  .card.warn { background: var(--warning-bg); border-color: #f0d497; }
  .card.critical { background: var(--critical-bg); border-color: #f0b9b9; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .card-head .ico { font-size: 1.4rem; line-height: 1; }
  .card-head h2, .card-head h3 { margin: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: var(--tap); padding: 10px 18px; border-radius: 999px; border: 2px solid var(--primary);
    background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; width: 100%;
    text-decoration: none; text-align: center;
  }
  .btn:disabled { opacity: 0.45; }
  .btn.secondary { background: #fff; color: var(--primary-dark); }
  .btn.ghost { background: transparent; color: var(--primary-dark); border-color: transparent; text-decoration: underline; min-height: 40px; }
  .btn.danger { background: var(--critical); border-color: var(--critical); }
  .btn.small { width: auto; min-height: 40px; padding: 6px 14px; font-size: 0.9rem; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-row .btn { flex: 1 1 45%; }
  .stack > * + * { margin-top: 10px; }

  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input[type="text"], input[type="tel"], input[type="number"], input[type="date"], select {
    width: 100%; min-height: var(--tap); border: 2px solid var(--border); border-radius: 12px;
    padding: 8px 12px; font-size: 1rem; background: #fff; color: var(--text);
  }
  input:focus, select:focus, button:focus-visible { outline: 3px solid var(--primary-light); outline-offset: 1px; }
  .checkbox-row { display: flex; align-items: flex-start; gap: 12px; margin: 12px 0; }
  .checkbox-row input { width: 28px; height: 28px; flex-shrink: 0; margin-top: 2px; accent-color: var(--primary); }
  .checkbox-row label { margin: 0; font-weight: 500; }
  .field-hint { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .choice-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .choice-btn {
    min-height: var(--tap); padding: 10px 18px; border-radius: 12px; border: 2px solid var(--border);
    background: #fff; cursor: pointer; font-weight: 600; flex: 1 1 40%; color: var(--text);
  }
  .choice-btn.selected { border-color: var(--primary); background: var(--surface-alt); color: var(--primary-dark); }

  nav.tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border);
    display: flex; padding: 4px 0 calc(4px + env(safe-area-inset-bottom)); z-index: 20;
  }
  nav.tab-bar button {
    flex: 1; background: none; border: none; padding: 6px 1px; min-height: var(--tap);
    display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--muted);
    font-size: 0.62rem; cursor: pointer; border-radius: 10px; line-height: 1.2;
  }
  nav.tab-bar button.active { color: var(--primary-dark); font-weight: 700; background: var(--surface-alt); }
  nav.tab-bar .tab-icon { font-size: 1.2rem; }

  .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; color: #fff; font-weight: 700; font-size: 0.88rem; }
  .badge.tier-a { background: var(--tier-a); }
  .badge.tier-b { background: var(--tier-b); }
  .badge.tier-c { background: var(--tier-c); }
  .badge.level { background: var(--primary); }
  .badge.soft { background: var(--surface-alt); color: var(--primary-dark); }
  .badge-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .status-line { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .status-line.good { color: #096b09; }
  .status-line.warn { color: var(--warning-ink); }
  .status-line.bad { color: var(--critical); }

  .progress-bar { background: var(--border); border-radius: 999px; height: 14px; overflow: hidden; margin: 8px 0; }
  .progress-bar > div { background: var(--primary); height: 100%; }

  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 8px 0; border-bottom: 1px solid var(--border); }
  ul.plain li:last-child { border-bottom: none; }

  .tag { display: inline-block; font-size: 0.78rem; padding: 4px 10px; border-radius: 999px; background: var(--surface-alt); color: var(--primary-dark); margin: 0 6px 6px 0; }

  .overlay {
    position: fixed; inset: 0; background: rgba(16,22,29,0.55); z-index: 40;
    display: flex; align-items: flex-end; justify-content: center; padding: 12px;
    overflow-y: auto;
  }
  .modal {
    background: var(--surface); border-radius: 20px; padding: 20px; width: 100%; max-width: 560px;
    margin: auto 0 0; max-height: 92vh; overflow-y: auto;
  }
  .modal.tall { margin: auto 0; }
  .modal-logo { display: block; width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 14px; }

  .a2hs-banner {
    position: fixed; left: 12px; right: 12px; bottom: 80px; background: var(--primary-dark); color: #fff;
    padding: 12px 14px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; z-index: 25; box-shadow: 0 4px 14px rgba(0,0,0,0.22);
  }
  .a2hs-banner p { margin: 0; font-size: 0.88rem; }
  .a2hs-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .a2hs-actions button { min-height: 40px; padding: 6px 12px; border-radius: 999px; border: none; font-weight: 700; cursor: pointer; }
  .a2hs-actions .install { background: #fff; color: var(--primary-dark); }
  .a2hs-actions .dismiss { background: transparent; color: #fff; text-decoration: underline; }

  .exercise { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
  .exercise:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .exercise-media { width: 100%; border-radius: 12px; margin-bottom: 10px; display: block; background: var(--surface-alt); }

  .safety-item {
    display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
    padding: 12px; margin-bottom: 8px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--border); background: #fff; color: var(--text); min-height: var(--tap);
  }
  .safety-item .ico { font-size: 1.3rem; line-height: 1.2; flex-shrink: 0; }
  .safety-item .txt { flex: 1; }
  .safety-item .state { font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
  .safety-item.done { background: var(--surface-alt); border-color: var(--primary); }
  .safety-item.done .state { color: var(--primary-dark); }
  .safety-item.todo { border-color: var(--warning); background: var(--warning-bg); }
  .safety-item.todo .state { color: var(--warning-ink); }

  .alert-card { border-radius: var(--radius); padding: 16px; margin-bottom: 14px; border: 2px solid; }
  .alert-card.critical { background: var(--critical-bg); border-color: var(--critical); }
  .alert-card.serious { background: var(--warning-bg); border-color: var(--serious); }
  .alert-card .sev { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 0.82rem; padding: 4px 12px; border-radius: 999px; color: #fff; margin-bottom: 8px; }
  .alert-card.critical .sev { background: var(--critical); }
  .alert-card.serious .sev { background: #b8620f; }
  .alert-card .sign { font-weight: 700; margin-bottom: 6px; }
  .alert-card .action { font-size: 0.95rem; }
  .call-bar { position: sticky; bottom: 92px; display: flex; flex-direction: column; gap: 10px; }

  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .chart-card h3 { margin-bottom: 2px; }
  .chart-latest { font-size: 1.6rem; font-weight: 700; margin: 2px 0 6px; }
  .chart-wrap { overflow-x: auto; }
  svg.chart { display: block; width: 100%; height: auto; }
  svg.chart .grid { stroke: var(--grid); stroke-width: 1; }
  svg.chart .axis-text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  svg.chart .value-label { fill: var(--text); font-size: 13px; font-weight: 700; }
  svg.chart .ref-line { stroke-width: 1.5; }
  svg.chart .ref-text { font-size: 11px; font-weight: 700; }
  details.table-view { margin-top: 8px; }
  details.table-view summary { cursor: pointer; color: var(--primary-dark); font-size: 0.85rem; min-height: 36px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 6px; }
  table.data th, table.data td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }

  .link-list a { display: block; padding: 12px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: var(--text); }
  .link-list a:last-child { border-bottom: none; }
  .link-list .title { color: var(--primary-dark); font-weight: 700; display: block; }
  .link-list .desc { color: var(--muted); font-size: 0.9rem; }

  .error-text { color: var(--critical); font-weight: 600; margin: 8px 0; }
  .timer-display { font-size: 2.6rem; font-weight: 800; text-align: center; margin: 12px 0; color: var(--primary-dark); font-variant-numeric: tabular-nums; }
  .step-dots { display: flex; gap: 6px; margin-bottom: 12px; }
  .step-dots span { height: 6px; flex: 1; border-radius: 3px; background: var(--border); }
  .step-dots span.on { background: var(--primary); }
  .freq-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .freq-row .name { flex: 1; font-size: 0.95rem; }
  .freq-row input { width: 84px; min-height: 44px; text-align: center; }
  .supplement-figure {
    background: var(--surface-alt); border-radius: 12px; padding: 12px 14px; margin-top: 10px;
  }
  .supplement-figure .label { display: block; font-weight: 600; font-size: 0.9rem; color: var(--muted); margin-bottom: 2px; }
  .supplement-figure .figure { font-size: 2.1rem; font-weight: 800; color: var(--primary-dark); line-height: 1.1; }
  .supplement-figure .unit { font-size: 0.95rem; color: var(--text); }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <svg viewBox="0 0 192 192" aria-hidden="true"><rect width="192" height="192" rx="38" fill="#ffffff"/><g fill="#1c5cab"><rect x="52" y="82" width="88" height="28" rx="14"/><circle cx="58" cy="76" r="21"/><circle cx="58" cy="116" r="21"/><circle cx="134" cy="76" r="21"/><circle cx="134" cy="116" r="21"/></g><g fill="#ffffff"><circle cx="74" cy="96" r="7.5"/><circle cx="95" cy="87" r="5.5"/><circle cx="96" cy="106" r="6.5"/><circle cx="116" cy="95" r="7"/></g></svg>
    <span class="app-name" id="appNameHeader"></span>
  </div>
  <button class="lang-toggle" id="langToggleBtn" type="button"></button>
</header>
<main class="screen" id="screen"></main>
<nav class="tab-bar" id="tabBar" hidden></nav>
<div class="a2hs-banner" id="a2hsBanner" hidden></div>
<div id="overlayRoot"></div>

<script src="app-core.js"></script>
<script>
(function () {
  var C = window.OsteoCore;
  var STORAGE_KEY = 'OSTEO_STATE';
  var WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbx_OKyqH-djTXzBJST5nP92vXLJu1L2WC7aAPLtxihT4ogDUtgWZkLAOOQmHVuvCJ3R/exec';
  var SHARED_TOKEN = 'mQ6tfi1HQa0fBNbhzt2AoVk_YKMfmX5v';

  var TABS = ['home', 'drug', 'bone', 'move', 'safety', 'track', 'alert'];
  var TAB_ICON = { home: '🏠', drug: '💊', bone: '🥛', move: '🚶', safety: '🛡️', track: '📈', alert: '🚨' };
  var TAB_LABEL_KEY = { home: 'navHome', drug: 'navDrug', bone: 'navBone', move: 'navMove', safety: 'navSafety', track: 'navTrack', alert: 'navAlert' };
  var MONTH_SHORT = {
    th: ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'],
    en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
  };

  var onboardingIndex = 0;
  var showingTierResult = false;
  var deferredInstallPrompt = null;
  var checkin = { open: false, steps: [], index: 0, fallLogged: false, missedDoses: false };
  var nutrition = { open: false, step: 0, draft: null, result: null };
  var chairStandTimer = { running: false, remaining: 30, awaitingReps: false, intervalId: null };
  var tugTimer = { running: false, elapsed: 0, intervalId: null };

  function defaultState() {
    return {
      schemaVersion: C.SCHEMA_VERSION,
      lang: 'th',
      activeTab: 'home',
      registered: false,
      patient: null,
      profile: {},
      tier: null,
      balance: { currentLevel: null, levelSetDate: null },
      medication: { classId: null, startDate: null, lastTakenDate: null, adherenceLog: [] },
      nutrition: { lastAssessedDate: null, answers: null, result: null },
      safety: { checkedIds: [], lastAuditDate: null },
      tracking: {
        falls: [], heightBaseline: null, heightLogs: [],
        dxaLastDate: null, dxaIntervalMonths: 24,
        chairStandTests: [], tugTests: []
      },
      monthlyCheckin: { lastDate: null },
      syncQueue: [],
      a2hsDismissed: false
    };
  }

  var state = loadState();

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || parsed.schemaVersion !== C.SCHEMA_VERSION) return defaultState();
      return Object.assign(defaultState(), parsed);
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function tr(key) {
    var entry = C.CONTENT[key];
    if (!entry) return key;
    return entry[state.lang] || entry.th;
  }

  function loc(pair) {
    if (!pair) return '';
    return pair[state.lang] || pair.th || '';
  }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function todayStr() { return C.formatYMD(new Date()); }
  function $(sel) { return document.querySelector(sel); }
  function $all(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

  function formatDate(dateStr) {
    if (!dateStr) return '-';
    var d = C.parseYMD(dateStr);
    return d.getDate() + ' ' + MONTH_SHORT[state.lang][d.getMonth()] + ' ' + d.getFullYear();
  }

  function formatMonthLabel(monthKey) {
    var parts = monthKey.split('-');
    return MONTH_SHORT[state.lang][parseInt(parts[1], 10) - 1];
  }

  function computeAvoidTags() {
    return state.profile.fractureSite === 'spine' ? ['vertebralFracture'] : [];
  }

  function computeFallsLast4Weeks() {
    var cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 28);
    return state.tracking.falls.filter(function (f) { return C.parseYMD(f.date) >= cutoff; }).length;
  }

  function latestEntry(list) { return list.length ? list[list.length - 1] : null; }

  function lastSelfTestDate() {
    var chair = latestEntry(state.tracking.chairStandTests);
    var tug = latestEntry(state.tracking.tugTests);
    if (!chair && !tug) return null;
    if (!chair) return tug.date;
    if (!tug) return chair.date;
    return chair.date > tug.date ? chair.date : tug.date;
  }

  function recomputeBalanceLevel() {
    var chair = latestEntry(state.tracking.chairStandTests);
    var tug = latestEntry(state.tracking.tugTests);
    var previous = state.balance.currentLevel;
    var next = C.resolveBalanceLevel(state.profile, {
      tier: state.tier,
      currentLevel: previous,
      levelSetDate: state.balance.levelSetDate,
      fallsLast4Weeks: computeFallsLast4Weeks(),
      age: state.profile.age,
      sex: state.profile.sex,
      chairStandReps: chair ? chair.reps : undefined,
      tugSeconds: tug ? tug.seconds : undefined,
      lastSelfTestDate: lastSelfTestDate(),
      today: todayStr()
    });
    if (next !== previous) {
      state.balance.currentLevel = next;
      state.balance.levelSetDate = todayStr();
    }
  }

  function enqueueSyncRecord(type, data) {
    C.queueRecord(state.syncQueue, Object.assign({
      patientId: state.patient ? state.patient.patientId : 'unknown',
      date: todayStr(),
      type: type
    }, data));
    saveState();
    flushSyncQueue();
  }

  function flushSyncQueue() {
    if (!WEBHOOK_URL || !state.syncQueue.length || !navigator.onLine) return;
    var item = state.syncQueue[0];
    var body = item.kind === 'registration'
      ? item.payload
      : Object.assign({ token: SHARED_TOKEN, schemaVersion: C.SCHEMA_VERSION }, item.payload);
    fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (res) {
        if (res.ok) {
          state.syncQueue.shift();
          saveState();
          flushSyncQueue();
        }
      })
      .catch(function () {});
  }

  window.addEventListener('online', flushSyncQueue);

  /* ---------- charts ---------- */

  function chartGeometry(pointCount) {
    return { width: 320, height: 170, padLeft: 42, padRight: 18, padTop: 16, padBottom: 26, count: pointCount };
  }

  function niceBounds(values, refValue) {
    var all = values.slice();
    if (typeof refValue === 'number') all.push(refValue);
    var min = Math.min.apply(null, all);
    var max = Math.max.apply(null, all);
    if (min === max) { min -= 1; max += 1; }
    var pad = (max - min) * 0.15;
    return { min: min - pad, max: max + pad };
  }

  function lineChart(opts) {
    var points = opts.points;
    if (points.length < 2) return '<p class="muted">' + esc(tr('trackNoData')) + '</p>';
    var g = chartGeometry(points.length);
    var bounds = niceBounds(points.map(function (p) { return p.value; }), opts.refValue);
    var plotW = g.width - g.padLeft - g.padRight;
    var plotH = g.height - g.padTop - g.padBottom;
    var x = function (i) { return g.padLeft + (points.length === 1 ? plotW / 2 : (plotW * i) / (points.length - 1)); };
    var y = function (v) { return g.padTop + plotH - ((v - bounds.min) / (bounds.max - bounds.min)) * plotH; };

    var svg = '<svg class="chart" viewBox="0 0 ' + g.width + ' ' + g.height + '" role="img" aria-label="' + esc(opts.title) + '">';
    [0, 0.5, 1].forEach(function (frac) {
      var yy = g.padTop + plotH * frac;
      var value = bounds.max - (bounds.max - bounds.min) * frac;
      svg += '<line class="grid" x1="' + g.padLeft + '" y1="' + yy + '" x2="' + (g.width - g.padRight) + '" y2="' + yy + '"/>';
      svg += '<text class="axis-text" x="' + (g.padLeft - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + esc(opts.formatAxis ? opts.formatAxis(value) : Math.round(value)) + '</text>';
    });

    if (typeof opts.refValue === 'number' && opts.refValue >= bounds.min && opts.refValue <= bounds.max) {
      var ry = y(opts.refValue);
      svg += '<line class="ref-line" x1="' + g.padLeft + '" y1="' + ry + '" x2="' + (g.width - g.padRight) + '" y2="' + ry + '" stroke="' + (opts.refColor || 'var(--warning)') + '"/>';
      svg += '<text class="ref-text" x="' + (g.padLeft + 4) + '" y="' + (ry - 5) + '" fill="' + (opts.refColor || 'var(--warning-ink)') + '">' + esc(opts.refLabel || '') + '</text>';
    }

    var path = points.map(function (p, i) { return (i === 0 ? 'M' : 'L') + x(i) + ' ' + y(p.value); }).join(' ');
    svg += '<path d="' + path + '" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';

    points.forEach(function (p, i) {
      svg += '<circle cx="' + x(i) + '" cy="' + y(p.value) + '" r="4.5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2">' +
        '<title>' + esc(formatDate(p.label) + ': ' + p.value + ' ' + (opts.unit || '')) + '</title></circle>';
    });

    var last = points[points.length - 1];
    var lastY = y(last.value);
    svg += '<text class="value-label" x="' + (g.width - g.padRight) + '" y="' + (lastY - 12) + '" text-anchor="end">' + esc(String(last.value)) + '</text>';
    svg += '<text class="axis-text" x="' + g.padLeft + '" y="' + (g.height - 8) + '">' + esc(formatDate(points[0].label)) + '</text>';
    svg += '<text class="axis-text" x="' + (g.width - g.padRight) + '" y="' + (g.height - 8) + '" text-anchor="end">' + esc(formatDate(last.label)) + '</text>';
    svg += '</svg>';

    return svg + tableView(points, opts.unit, opts.valueHeader, formatDate);
  }

  function barChart(opts) {
    var points = opts.points;
    var g = chartGeometry(points.length);
    var plotW = g.width - g.padLeft - g.padRight;
    var plotH = g.height - g.padTop - g.padBottom;
    var max = Math.max(1, Math.max.apply(null, points.map(function (p) { return p.value; })));
    var slot = plotW / points.length;
    var barW = Math.min(24, slot - 8);

    var svg = '<svg class="chart" viewBox="0 0 ' + g.width + ' ' + g.height + '" role="img" aria-label="' + esc(opts.title) + '">';
    [0, 0.5, 1].forEach(function (frac) {
      var yy = g.padTop + plotH * frac;
      svg += '<line class="grid" x1="' + g.padLeft + '" y1="' + yy + '" x2="' + (g.width - g.padRight) + '" y2="' + yy + '"/>';
      svg += '<text class="axis-text" x="' + (g.padLeft - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + Math.round(max - max * frac) + '</text>';
    });

    points.forEach(function (p, i) {
      var cx = g.padLeft + slot * i + slot / 2;
      var h = (p.value / max) * plotH;
      var yTop = g.padTop + plotH - h;
      if (p.value > 0) {
        svg += '<rect x="' + (cx - barW / 2) + '" y="' + yTop + '" width="' + barW + '" height="' + h + '" rx="4" fill="' + (opts.color || 'var(--series-1)') + '">' +
          '<title>' + esc(formatMonthLabel(p.label) + ': ' + p.value) + '</title></rect>';
        svg += '<text class="value-label" x="' + cx + '" y="' + (yTop - 5) + '" text-anchor="middle">' + p.value + '</text>';
      }
      svg += '<text class="axis-text" x="' + cx + '" y="' + (g.height - 8) + '" text-anchor="middle">' + esc(formatMonthLabel(p.label)) + '</text>';
    });
    svg += '</svg>';

    return svg + tableView(points, opts.unit, opts.valueHeader, formatMonthLabel);
  }

  function tableView(points, unit, valueHeader, labelFormatter) {
    return '<details class="table-view"><summary>' + esc(state.lang === 'th' ? 'ดูเป็นตาราง' : 'View as table') + '</summary>' +
      '<table class="data"><thead><tr><th>' + esc(state.lang === 'th' ? 'วันที่' : 'Date') + '</th><th>' + esc(valueHeader || '') + (unit ? ' (' + esc(unit) + ')' : '') + '</th></tr></thead><tbody>' +
      points.map(function (p) { return '<tr><td>' + esc(labelFormatter(p.label)) + '</td><td>' + esc(String(p.value)) + '</td></tr>'; }).join('') +
      '</tbody></table></details>';

  function handleRegisterSubmit(form) {
    var fd = new FormData(form);
    var hnUnknown = !!fd.get('hnUnknown');
    var hn = (fd.get('hn') || '').trim();
    var yearRaw = fd.get('yearOfBirth');
    var sex = fd.get('sex');
    var errorBox = $('#registerError');

    function fail(msgKey) {
      errorBox.hidden = false;
      errorBox.textContent = tr(msgKey);
    }

    if (!hn && !hnUnknown) return fail('registerHNRequired');
    if (C.deriveAge(yearRaw) === null) return fail('registerYearInvalid');
    if (!sex) return fail('registerSexRequired');
    if (!fd.get('consent')) return fail('registerConsentRequired');

    var payload = C.buildRegistrationPayload({
      hn: hn, hnUnknown: hnUnknown, yearOfBirth: yearRaw, sex: sex,
      consent: true, deviceUuid: C.generateDeviceUuid()
    }, SHARED_TOKEN);

    var validation = C.validateRegistrationPayload(payload);
    if (!validation.valid) {
      errorBox.hidden = false;
      errorBox.textContent = validation.errors.join(', ');
      return;
    }

    errorBox.hidden = true;
    state.patient = payload;
    state.profile.age = payload.age;
    state.profile.sex = payload.sex;
    state.registered = true;
    state.syncQueue.push({ kind: 'registration', payload: payload });
    saveState();
    flushSyncQueue();
    render();
  }

  /* ---------- onboarding ---------- */

  function questionApplies(q) {
    if (!q.dependsOn) return true;
    return state.profile[q.dependsOn.field] === q.dependsOn.value;
  }

  function currentQuestionIndex() {
    var qs = C.ONBOARDING_QUESTIONS;
    var idx = onboardingIndex;
    while (idx < qs.length && !questionApplies(qs[idx])) idx++;
    return idx;
  }

  function renderOnboarding() {
    var qs = C.ONBOARDING_QUESTIONS;
    var idx = currentQuestionIndex();

    if (idx >= qs.length && !showingTierResult) {
      finishOnboarding();
      showingTierResult = true;
    }
    if (showingTierResult) return renderTierResult();

    var q = qs[idx];
    var value = state.profile[q.field];
    var input = '';

    if (q.type === 'boolean') {
      input = '<div class="choice-grid">' +
        '<button type="button" class="choice-btn' + (value === true ? ' selected' : '') + '" data-action="answer" data-field="' + q.field + '" data-type="boolean" data-value="true">' + esc(tr('yes')) + '</button>' +
        '<button type="button" class="choice-btn' + (value === false ? ' selected' : '') + '" data-action="answer" data-field="' + q.field + '" data-type="boolean" data-value="false">' + esc(tr('no')) + '</button>' +
        '</div>';
    } else if (q.type === 'choice') {
      input = '<div class="choice-grid">' + q.options.map(function (opt) {
        var label = opt.labelKey ? tr(opt.labelKey) : loc(opt.label);
        return '<button type="button" class="choice-btn' + (value === opt.value ? ' selected' : '') + '" data-action="answer" data-field="' + q.field + '" data-type="choice" data-value="' + esc(opt.value) + '">' + esc(label) + '</button>';
      }).join('') + '</div>';
    } else {
      input = '<input type="number" inputmode="decimal" step="any" id="onboardingNumberInput" value="' + (value === undefined ? '' : esc(value)) + '">';
    }

    var ready = value !== undefined && value !== null && value !== '';
    return '' +
      '<div class="step-dots">' + qs.map(function (_, i) { return '<span class="' + (i <= idx ? 'on' : '') + '"></span>'; }).join('') + '</div>' +
      '<p class="muted">' + esc(tr('onboardingTitle')) + ' — ' + esc(tr('onboardingProgress')) + ' ' + (idx + 1) + '</p>' +
      '<div class="card"><h2>' + esc(tr(q.labelKey)) + '</h2>' + input + '</div>' +
      '<div class="btn-row">' +
        (idx > 0 ? '<button type="button" class="btn secondary" data-action="onboarding-back">' + esc(tr('onboardingBack')) + '</button>' : '') +
        '<button type="button" class="btn" id="onboardingNextBtn" data-action="onboarding-next"' + (ready ? '' : ' disabled') + '>' + esc(tr('onboardingNext')) + '</button>' +
      '</div>';
  }

    if (state.profile.currentMedClass && state.profile.currentMedClass !== 'none' && !state.medication.classId) {

    saveState();

  /* ---------- home ---------- */

  var SAFETY_TIP_KEYS = ['footwearBody', 'visionBody', 'gettingUpBody', 'fallRiskMedsBody', 'moveNeverDoBody'];

  function medStatus() {
    var m = state.medication;
    if (!m.classId) return null;
    var med = C.getMedClass(m.classId);
    var base = m.lastTakenDate || m.startDate;
    if (!base) return { med: med, nextDue: null, needsStartDate: true };
    var nextDue = C.computeNextDue(m.classId, base);
    var days = C.daysBetween(todayStr(), nextDue);
    return {
      med: med,
      nextDue: nextDue,
      daysUntil: days,
      overdue: days < 0,
      dueToday: days === 0,
      takenToday: m.lastTakenDate === todayStr()
    };
  }

  function buildIcsDataUri(med, dueDateStr) {
    var ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Osteoporosis Care//TH\r\nBEGIN:VEVENT\r\nDTSTART;VALUE=DATE:' + dueDateStr.replace(/-/g, '') +

      '\r\nDESCRIPTION:' + loc(med.instructions).replace(/[\r\n]/g, ' ') +
      '\r\nEND:VEVENT\r\nEND:VCALENDAR';
    return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);

      '<p class="muted">' + esc(tr('boneNutritionIntro')) + '</p>';

      html += '<p>' + esc(tr('nutritionLastDone')) + ': <strong>' + esc(formatDate(state.nutrition.lastAssessedDate)) + '</strong><br>' +
        esc(tr('nutritionNextDue')) + ': ' + esc(formatDate(C.addMonthsSafe(state.nutrition.lastAssessedDate, C.NUTRITION_REVIEW_MONTHS))) + '</p>';
    } else {
      html += '<p class="muted">' + esc(tr('nutritionNeverDone')) + '</p>';
    }
    html += '<button type="button" class="btn" data-action="open-nutrition">' +
      esc(state.nutrition.lastAssessedDate ? tr('nutritionRedo') : tr('nutritionStart')) + '</button></div>';

    html += '<div class="card"><div class="card-head"><span class="ico">🦴</span><h3>' + esc(tr('boneWhatIsTitle')) + '</h3></div><p>' + esc(tr('boneWhatIsBody')) + '</p></div>';
    html += '<div class="card"><div class="card-head"><span class="ico">🚫</span><h3>' + esc(tr('avoidTitle')) + '</h3></div><p>' + esc(tr('avoidBody')) + '</p></div>';

  }

  function supplementFigure(label, value, unit) {
    return '<div class="supplement-figure"><span class="label">' + esc(label) + '</span>' +
      '<span class="figure">' + value + '</span> <span class="unit">' + esc(unit) + '</span></div>';
  }

  function renderNutritionResultCards(result) {
    var html = '';
    var ca = result.calcium;
    html += '<div class="card"><div class="card-head"><span class="ico">🥛</span><h3>' + esc(tr('nutritionSectionCalcium')) + '</h3></div>' +
      '<p>' + esc(tr('nutritionEstimatedIntake')) + ': <strong>' + ca.intakeMg + ' ' + esc(tr('calciumMgUnit')) + '</strong> / ' +
      esc(tr('nutritionTarget')) + ' ' + ca.targetMg + ' ' + esc(tr('calciumMgUnit')) + '</p>' +
      '<div class="progress-bar"><div style="width:' + Math.min(100, Math.round(ca.intakeMg / ca.targetMg * 100)) + '%"></div></div>';
    html += ca.sufficient
      ? '<p class="status-line good">✓ ' + esc(tr('nutritionEnough')) + '</p>'
      : '<p>' + esc(tr('nutritionGap')) + ' ' + ca.gapMg + ' ' + esc(tr('calciumMgUnit')) + '</p>' +
        supplementFigure(tr('nutritionSupplementAdvice'), ca.suggestedSupplementMg, tr('nutritionCalciumSupplementUnit'));
    html += '</div>';

    var vd = result.vitaminD;
    html += '<div class="card"><div class="card-head"><span class="ico">☀️</span><h3>' + esc(tr('nutritionSectionVitD')) + '</h3></div>' +
      '<p>' + esc(vd.lowSun ? tr('nutritionSunLow') : tr('nutritionSunOk')) + '</p>' +
      '<p>' + esc(tr('nutritionEstimatedIntake')) + ': <strong>' + vd.dietIu + ' ' + esc(tr('iuUnit')) + '</strong></p>' +
      supplementFigure(tr('nutritionSupplementAdvice'), vd.suggestedSupplementIu, tr('nutritionVitDSupplementUnit')) + '</div>';

    if (result.protein) {
      var pr = result.protein;
      html += '<div class="card"><div class="card-head"><span class="ico">🍳</span><h3>' + esc(tr('nutritionSectionProtein')) + '</h3></div>' +
        '<p>' + esc(tr('nutritionEstimatedIntake')) + ': <strong>' + pr.intakeG + ' ' + esc(tr('gramUnit')) + '</strong> / ' +
        esc(tr('nutritionTarget')) + ' ' + pr.targetG + ' ' + esc(tr('gramUnit')) + '</p>' +
        '<div class="progress-bar"><div style="width:' + Math.min(100, Math.round(pr.intakeG / pr.targetG * 100)) + '%"></div></div>';
      html += pr.sufficient
        ? '<p class="status-line good">✓ ' + esc(tr('nutritionEnough')) + '</p>'
        : '<p>' + esc(tr('nutritionGap')) + ' ' + pr.gapG + ' ' + esc(tr('nutritionProteinGap')) + '</p>' +
          '<p class="muted">' + esc(tr('nutritionProteinIdea')) + ' ' + esc(state.lang === 'th' ? ('ไข่ ' + pr.exampleEggs + ' ฟองต่อวัน') : (pr.exampleEggs + ' eggs a day')) + '</p>';
      html += '</div>';
    }

    html += '<div class="card warn"><p>' + esc(tr('nutritionConfirmDoctor')) + '</p></div>';
    return html;
  }

  /* ---------- nutrition wizard ---------- */

  function renderNutritionWizard() {
    var steps = ['calcium', 'vitaminD', 'protein', 'result'];
    var stepId = steps[nutrition.step];
    var html = '<div class="step-dots">' + steps.map(function (_, i) { return '<span class="' + (i <= nutrition.step ? 'on' : '') + '"></span>'; }).join('') + '</div>';
    html += '<p class="muted">' + esc(tr('step')) + ' ' + (nutrition.step + 1) + ' ' + esc(tr('of')) + ' ' + steps.length + '</p>';

    if (stepId === 'calcium') {
      html += '<h2>' + esc(tr('nutritionSectionCalcium')) + '</h2><p class="muted">' + esc(tr('nutritionFoodFrequencyIntro')) + '</p>';
      html += C.CALCIUM_FOODS.map(function (f) {
        return freqRow('ca_' + f.id, loc(f.name) + ' — ' + loc(f.serving), nutrition.draft.calcium[f.id]);
      }).join('');
      html += '<p class="muted">' + esc(tr('nutritionServingsPerWeek')) + '</p>';
    } else if (stepId === 'vitaminD') {
      html += '<h2>' + esc(tr('nutritionSectionVitD')) + '</h2>';
      html += '<label for="sunMinutes">' + esc(tr('nutritionSunQuestion')) + '</label>' +
        '<input type="number" id="sunMinutes" inputmode="numeric" value="' + esc(nutrition.draft.sunMinutesPerWeek === null ? '' : nutrition.draft.sunMinutesPerWeek) + '">';
      html += '<p class="muted" style="margin-top:14px;">' + esc(tr('nutritionFoodFrequencyIntro')) + '</p>';
      html += C.VITAMIN_D_FOODS.map(function (f) {
        return freqRow('vd_' + f.id, loc(f.name) + ' — ' + loc(f.serving), nutrition.draft.vitaminD[f.id]);
      }).join('');
      html += '<p class="muted">' + esc(tr('nutritionServingsPerWeek')) + '</p>';
    } else if (stepId === 'protein') {
      html += '<h2>' + esc(tr('nutritionSectionProtein')) + '</h2>';
      html += '<label for="weightKg">' + esc(tr('nutritionWeightQuestion')) + '</label>' +
        '<input type="number" id="weightKg" inputmode="decimal" step="0.1" value="' + esc(nutrition.draft.weightKg === null ? '' : nutrition.draft.weightKg) + '">';
      html += '<p class="muted" style="margin-top:14px;">' + esc(tr('nutritionServingsPerDay')) + '</p>';
      html += C.PROTEIN_FOODS.map(function (f) {
        return freqRow('pr_' + f.id, loc(f.name) + ' — ' + loc(f.serving), nutrition.draft.protein[f.id]);
      }).join('');
    } else {
      html += '<h2>' + esc(tr('nutritionResultTitle')) + '</h2>';
      html += renderNutritionResultCards(nutrition.result);
    }

    html += '<div class="btn-row" style="margin-top:16px;">';
    if (nutrition.step > 0 && stepId !== 'result') {
      html += '<button type="button" class="btn secondary" data-action="nutrition-back">' + esc(tr('back')) + '</button>';
    }
    if (stepId === 'result') {
      html += '<button type="button" class="btn" data-action="nutrition-save">' + esc(tr('save')) + '</button>';
    } else {
      html += '<button type="button" class="btn" data-action="nutrition-next">' + esc(tr('onboardingNext')) + '</button>';
    }
    html += '</div>';
    html += '<button type="button" class="btn ghost" data-action="nutrition-close">' + esc(tr('cancel')) + '</button>';
    return html;
  }

  function freqRow(id, label, value) {
    return '<div class="freq-row"><span class="name">' + esc(label) + '</span>' +
      '<input type="number" inputmode="numeric" min="0" id="' + id + '" value="' + (value === undefined || value === null ? '' : esc(value)) + '" placeholder="0"></div>';
  }

  function collectNutritionStep() {
    var steps = ['calcium', 'vitaminD', 'protein', 'result'];
    var stepId = steps[nutrition.step];
    if (stepId === 'calcium') {
      C.CALCIUM_FOODS.forEach(function (f) {
        var el = document.getElementById('ca_' + f.id);
        if (el) nutrition.draft.calcium[f.id] = el.value === '' ? 0 : parseFloat(el.value);
      });
    } else if (stepId === 'vitaminD') {
      var sun = document.getElementById('sunMinutes');
      if (sun) nutrition.draft.sunMinutesPerWeek = sun.value === '' ? 0 : parseFloat(sun.value);
      C.VITAMIN_D_FOODS.forEach(function (f) {
        var el = document.getElementById('vd_' + f.id);
        if (el) nutrition.draft.vitaminD[f.id] = el.value === '' ? 0 : parseFloat(el.value);
      });
    } else if (stepId === 'protein') {
      var weight = document.getElementById('weightKg');
      if (weight) nutrition.draft.weightKg = weight.value === '' ? null : parseFloat(weight.value);
      C.PROTEIN_FOODS.forEach(function (f) {
        var el = document.getElementById('pr_' + f.id);
        if (el) nutrition.draft.protein[f.id] = el.value === '' ? 0 : parseFloat(el.value);
      });
    }
  }

  function openNutrition() {
    var saved = state.nutrition.answers;
    nutrition.draft = saved
      ? JSON.parse(JSON.stringify(saved))
      : { calcium: {}, vitaminD: {}, protein: {}, weightKg: null, sunMinutesPerWeek: null };
    nutrition.step = 0;
    nutrition.result = null;
    nutrition.open = true;
    render();
  }

  /* ---------- move tab ---------- */

  function renderMove() {
    var level = state.balance.currentLevel;
    var exercises = C.getExercisesForPatient(level, computeAvoidTags());
    var groups = [
      { id: 'balance', labelKey: 'moveGroupBalance', freqKey: 'moveBalanceFrequency', icon: '⚖️' },
      { id: 'strength', labelKey: 'moveGroupStrength', freqKey: 'moveStrengthFrequency', icon: '💪' },
      { id: 'posture', labelKey: 'moveGroupPosture', freqKey: 'movePostureFrequency', icon: '🧍' }
    ];
    var reqKey = { chair: 'reqChair', wall: 'reqWall', band: 'reqBand' };

    var html = '<h1>' + esc(tr('tabTitleMove')) + '</h1>';
    html += '<div class="card accent"><span class="badge level">' + esc(tr('balanceLevel' + level)) + '</span>' +
      '<p style="margin-top:10px;">' + esc(tr('moveIntro')) + '</p>' +
      '<p class="muted">🚶 ' + esc(tr('moveWalking')) + '</p></div>';

    groups.forEach(function (group) {
      html += '<div class="card"><div class="card-head"><span class="ico">' + group.icon + '</span><h2>' + esc(tr(group.labelKey)) + '</h2></div>' +
        '<p class="muted">' + esc(tr('moveHowOften')) + ': ' + esc(tr(group.freqKey)) + '</p>';
      html += exercises.filter(function (ex) { return ex.group === group.id; }).map(function (ex) {
        var media = C.getExerciseMedia(ex.id);
        var mediaHtml = '';
        if (media) {
          mediaHtml = media.type === 'video'
            ? '<video class="exercise-media" controls preload="none" playsinline src="' + esc(media.src) + '"' + (media.poster ? ' poster="' + esc(media.poster) + '"' : '') + '></video>'
            : '<img class="exercise-media" loading="lazy" src="' + esc(media.src) + '" alt="' + esc(loc(ex.name)) + '">';
        }
        var reqs = ex.requires.length
          ? ex.requires.map(function (r) { return '<span class="tag">' + esc(tr(reqKey[r])) + '</span>'; }).join('')
          : '<span class="tag">' + esc(tr('reqNone')) + '</span>';
        return '<div class="exercise">' + mediaHtml +
          '<h3>' + esc(loc(ex.name)) + '</h3>' +
          '<p>' + esc(loc(ex.howTo)) + '</p>' +
          '<p><span class="tag">' + esc(tr('exerciseAmount')) + ': ' + esc(loc(ex.amount)) + '</span>' + reqs + '</p>' +
          '</div>';
      }).join('');
      html += '</div>';
    });

    html += '<div class="card critical"><div class="card-head"><span class="ico">⛔</span><h3>' + esc(tr('moveNeverDo')) + '</h3></div><p>' + esc(tr('moveNeverDoBody')) + '</p></div>';
    return html;
  }

  /* ---------- safety tab ---------- */

  function renderSafety() {
    var checked = state.safety.checkedIds;
    var result = C.computeSafetyScore(checked);
    var rooms = [
      { id: 'bedroom', labelKey: 'safetyRoomBedroom', icon: '🛏️' },
      { id: 'bathroom', labelKey: 'safetyRoomBathroom', icon: '🚿' },
      { id: 'stairs', labelKey: 'safetyRoomStairs', icon: '🪜' },
      { id: 'kitchen', labelKey: 'safetyRoomKitchen', icon: '🍳' },
      { id: 'outdoors', labelKey: 'safetyRoomOutdoors', icon: '🌳' }
    ];

    var html = '<h1>' + esc(tr('tabTitleSafety')) + '</h1>';
    html += '<div class="card accent"><h2>' + esc(tr('safetyScoreLabel')) + ': ' + result.score + ' / ' + result.max + '</h2>' +
      '<div class="progress-bar"><div style="width:' + Math.round(result.score / result.max * 100) + '%"></div></div>' +
      '<p class="muted">' + esc(tr('safetyIntro')) + '</p>';
    if (result.priorityFixes.length) {
      html += '<h3>' + esc(tr('safetyPriorityTitle')) + '</h3><ul class="plain">' +
        result.priorityFixes.map(function (i) { return '<li>' + i.icon + ' ' + esc(loc(i.name)) + '</li>'; }).join('') + '</ul>';
    } else {
      html += '<p class="status-line good">✓ ' + esc(tr('safetyAllDone')) + '</p>';
    }
    if (state.safety.lastAuditDate) {
      html += '<p class="muted">' + esc(tr('safetyLastChecked')) + ': ' + esc(formatDate(state.safety.lastAuditDate)) + '</p>';
    }
    if (C.isSafetyAuditDue(state.safety.lastAuditDate, todayStr())) {
      html += '<p class="muted">🔄 ' + esc(tr('reauditReminder')) + '</p>';
    }
    html += '</div>';

    rooms.forEach(function (room) {
      html += '<div class="card"><div class="card-head"><span class="ico">' + room.icon + '</span><h3>' + esc(tr(room.labelKey)) + '</h3></div>';
      html += C.SAFETY_ITEMS.filter(function (i) { return i.room === room.id; }).map(function (item) {
        var isDone = checked.indexOf(item.id) !== -1;
        return '<button type="button" class="safety-item ' + (isDone ? 'done' : 'todo') + '" data-action="toggle-safety" data-item-id="' + item.id + '" aria-pressed="' + isDone + '">' +
          '<span class="ico" aria-hidden="true">' + item.icon + '</span>' +
          '<span class="txt">' + esc(loc(item.name)) + '</span>' +
          '<span class="state">' + (isDone ? '✓ ' + esc(tr('safetyDone')) : '● ' + esc(tr('safetyTodo'))) + '</span>' +
          '</button>';
      }).join('');
      html += '</div>';
    });

    html += '<button type="button" class="btn" data-action="save-safety-audit">' + esc(tr('safetySave')) + '</button>';
    html += infoCard('👟', 'footwearTitle', C.CONTENT.footwearBody);
    html += infoCard('👓', 'visionTitle', C.CONTENT.visionBody);
    html += infoCard('💊', 'fallRiskMedsTitle', C.CONTENT.fallRiskMedsBody);
    html += infoCard('🆘', 'gettingUpTitle', C.CONTENT.gettingUpBody);
    return html;
  }

  /* ---------- track tab ---------- */

  function renderTrack() {
    var html = '<h1>' + esc(tr('trackTitle')) + '</h1>';
    html += renderHeightCard();
    html += renderChairStandCard();
    html += renderTugCard();
    html += renderFallsCard();
    html += renderAdherenceCard();
    html += renderDxaCard();
    return html;
  }

  function renderHeightCard() {
    var logs = state.tracking.heightLogs;
    var baseline = state.tracking.heightBaseline;
    var latest = latestEntry(logs);
    var flagged = latest && C.checkHeightLoss(baseline, latest.cm);
    var points = C.buildTimeSeries(logs, 'cm');

    var html = '<div class="chart-card"><div class="card-head"><span class="ico">📏</span><h3>' + esc(tr('heightChartTitle')) + '</h3></div>';
    if (latest) html += '<p class="chart-latest">' + latest.cm + ' <span class="muted" style="font-size:1rem;">cm</span></p>';
    html += '<div class="chart-wrap">' + lineChart({
      points: points, title: tr('heightChartTitle'), unit: 'cm', valueHeader: tr('heightTitle'),
      refValue: baseline ? baseline - C.HEIGHT_LOSS_FLAG_CM : undefined,
      refLabel: baseline ? '-' + C.HEIGHT_LOSS_FLAG_CM + ' cm' : '',
      refColor: 'var(--critical)',
      formatAxis: function (v) { return v.toFixed(1); }
    }) + '</div>';
    if (flagged) html += '<p class="status-line bad">⚠ ' + esc(tr('heightLossWarning')) + '</p>';
    else if (latest) html += '<p class="status-line good">✓ ' + esc(tr('heightLossOk')) + '</p>';
    html += '<label for="heightInput">' + esc(tr('heightCurrent')) + '</label>' +
      '<input type="number" id="heightInput" inputmode="decimal" step="0.1" placeholder="cm">' +
      '<button type="button" class="btn secondary" style="margin-top:10px;" data-action="save-height">' + esc(tr('save')) + '</button>' +
      '<p class="muted">' + esc(tr('heightEvery6Months')) + '</p></div>';
    return html;
  }

  function renderChairStandCard() {
    var tests = state.tracking.chairStandTests;
    var latest = latestEntry(tests);
    var norm = C.chairStandNorm(state.profile.age || 70, state.profile.sex || 'female');
    var html = '<div class="chart-card"><div class="card-head"><span class="ico">🪑</span><h3>' + esc(tr('chairStandTitle')) + '</h3></div>';
    html += '<p class="muted">' + esc(tr('chairStandInstructions')) + '</p>';
    html += '<div class="card warn" style="margin:10px 0;"><p style="margin:0;">⚠ ' + esc(tr('selfTestSafety')) + '</p></div>';
    if (latest) {
      html += '<p class="chart-latest">' + latest.reps + ' <span class="muted" style="font-size:1rem;">' + esc(tr('reps')) + '</span></p>';
      html += '<p class="status-line ' + (latest.reps >= norm ? 'good' : 'warn') + '">' + (latest.reps >= norm ? '✓ ' + esc(tr('chairStandPass')) : '● ' + esc(tr('chairStandBelow'))) + '</p>';

      html += '<label for="chairStandRepsField">' + esc(tr('reps')) + '</label>' +

        '<button type="button" class="btn" style="margin-top:10px;" data-action="save-chairstand">' + esc(tr('recordResult')) + '</button>';
    }
    html += '</div>';

  }

    html += '<p class="muted">' + esc(tr('tugInstructions')) + '</p>';

  function renderAdherenceCard() {
    var log = state.medication.adherenceLog;
    if (!state.medication.classId) return '';
    var streak = C.computeAdherenceStreak(log.map(function (a) { return a.date; }), todayStr());
    var html = '<div class="chart-card"><div class="card-head"><span class="ico">💊</span><h3>' + esc(tr('adherenceChartTitle')) + '</h3></div>';
    if (log.length) {
      html += '<div class="chart-wrap">' + barChart({
        points: C.buildMonthlyCounts(log.map(function (a) { return a.date; }), 6, todayStr()),
        title: tr('adherenceChartTitle'), valueHeader: tr('adherenceTitle')
      }) + '</div>';
    } else {
      html += '<p class="muted">' + esc(tr('drugAdherenceEmpty')) + '</p>';
    }
    if (streak > 1) html += '<p class="status-line good">🔥 ' + esc(tr('adherenceStreak')) + ': ' + streak + ' ' + esc(tr('days')) + '</p>';
    html += '</div>';
    return html;
  }

  function renderDxaCard() {
    var dxa = state.tracking;
    var next = dxa.dxaLastDate ? C.addMonthsSafe(dxa.dxaLastDate, dxa.dxaIntervalMonths) : null;
    return '<div class="card"><div class="card-head"><span class="ico">🩻</span><h3>' + esc(tr('dxaTitle')) + '</h3></div>' +
      '<label for="dxaDateInput">' + esc(tr('dxaLastDate')) + '</label>' +
      '<input type="date" id="dxaDateInput" value="' + esc(dxa.dxaLastDate || '') + '">' +
      '<button type="button" class="btn secondary" style="margin-top:10px;" data-action="save-dxa">' + esc(tr('save')) + '</button>' +
      (next ? '<p style="margin-top:10px;">' + esc(tr('dxaNextDue')) + ': <strong>' + esc(formatDate(next)) + '</strong></p>' : '') +
      '<p class="muted">' + esc(tr('dxaNote')) + '</p></div>';
  }

  /* ---------- alert tab ---------- */

  function renderAlert() {
    var justFell = state.tracking.falls.length && latestEntry(state.tracking.falls).injured &&
      C.daysBetween(latestEntry(state.tracking.falls).date, todayStr()) <= 1;

    var html = '<h1>' + esc(tr('alertTitle')) + '</h1>';
    if (justFell) html += '<div class="card critical"><p style="margin:0;">🩹 ' + esc(tr('alertAfterFall')) + '</p></div>';
    html += '<p class="muted">' + esc(tr('alertIntro')) + '</p>';

    html += C.RED_FLAGS.map(function (flag) {
      return '<div class="alert-card ' + flag.severity + '">' +
        '<span class="sev">' + flag.icon + ' ' + esc(tr(flag.severity === 'critical' ? 'alertSeverityCritical' : 'alertSeveritySerious')) + '</span>' +
        '<div class="sign">' + esc(tr(flag.key)) + '</div>' +
        '<div class="action">→ ' + esc(tr(flag.actionKey)) + '</div>' +
        '</div>';
    }).join('');

    html += '<div class="call-bar">' +
      '<a class="btn danger" href="tel:' + C.ALERT_CONTACTS.emsPhone + '">📞 ' + esc(tr('alertCallEms')) + '</a>' +
      '<a class="btn secondary" href="tel:' + C.ALERT_CONTACTS.clinicPhone.replace(/\s/g, '') + '">🏥 ' + esc(tr('alertCallClinic')) + ' ' + esc(C.ALERT_CONTACTS.clinicPhone) + '</a>' +
      '</div>';
    return html;
  }

  /* ---------- resources ---------- */

  function renderResources() {
    var html = '<button type="button" class="btn ghost" data-action="go-tab" data-tab="home">← ' + esc(tr('back')) + '</button>';
    html += '<h1>' + esc(tr('resourcesTitle')) + '</h1>';
    [['learnWhatIsTitle', 'boneWhatIsBody', '🦴'], ['learnMedMattersTitle', 'learnMedMattersBody', '💊'],
     ['learnTScoreTitle', 'learnTScoreBody', '📊'], ['learnExpectTitle', 'learnExpectBody', '🎯']].forEach(function (panel) {
      html += '<div class="card"><div class="card-head"><span class="ico">' + panel[2] + '</span><h3>' + esc(tr(panel[0])) + '</h3></div><p>' + esc(tr(panel[1])) + '</p></div>';
    });
    html += '<div class="card link-list">' + C.RESOURCE_LINKS.map(function (link) {
      var card = C.renderResourceCard(link, state.lang);
      return '<a href="' + esc(link.url) + '" target="_blank" rel="noopener"><span class="title">' + esc(card.title) + '</span><span class="desc">' + esc(card.description) + '</span></a>';
    }).join('') + '</div>';
    return html;
  }

  /* ---------- monthly check-in ---------- */

  function buildCheckinSteps() {
    var steps = ['falls'];
    if (state.medication.classId) steps.push('medication');
    if (C.isHeightCheckDue(latestEntry(state.tracking.heightLogs) ? latestEntry(state.tracking.heightLogs).date : null, todayStr())) steps.push('height');
    if (C.isSelfTestDue(lastSelfTestDate(), todayStr())) steps.push('selftest');
    steps.push('done');
    return steps;
  }

  function renderCheckin() {
    var stepId = checkin.steps[checkin.index];
    var html = '<div class="step-dots">' + checkin.steps.map(function (_, i) { return '<span class="' + (i <= checkin.index ? 'on' : '') + '"></span>'; }).join('') + '</div>';
    html += '<p class="muted">' + esc(tr('monthlyCheckinTitle')) + ' — ' + esc(tr('step')) + ' ' + (checkin.index + 1) + ' ' + esc(tr('of')) + ' ' + checkin.steps.length + '</p>';

    if (stepId === 'falls') {
      html += '<h2>' + esc(tr('checkinStepFalls')) + '</h2><p class="muted">' + esc(tr('checkinStepFallsHelp')) + '</p>';
      if (checkin.fallLogged) {
        html += '<p class="status-line warn">✓ ' + esc(tr('checkinFallLogged')) + '</p>' +
          '<button type="button" class="btn" data-action="checkin-next">' + esc(tr('onboardingNext')) + '</button>';
      } else {
        html += '<div id="checkinFallForm" hidden>' +
          '<label for="checkinFallDate">' + esc(tr('fallsLogDate')) + '</label>' +
          '<input type="date" id="checkinFallDate" value="' + todayStr() + '">' +
          '<label>' + esc(tr('fallsLogInjured')) + '</label>' +
          '<div class="choice-grid">' +
            '<button type="button" class="choice-btn" data-action="set-checkin-injured" data-value="true">' + esc(tr('yes')) + '</button>' +
            '<button type="button" class="choice-btn selected" data-action="set-checkin-injured" data-value="false">' + esc(tr('no')) + '</button>' +
          '</div>' +
          '<input type="hidden" id="checkinInjuredField" value="false">' +
          '<label for="checkinFallCause">' + esc(tr('fallsLogCause')) + '</label><input type="text" id="checkinFallCause">' +
          '<button type="button" class="btn" style="margin-top:12px;" data-action="checkin-save-fall">' + esc(tr('fallsLogAdd')) + '</button>' +
          '</div>' +
          '<div class="btn-row" id="checkinFallChoice">' +
            '<button type="button" class="btn secondary" data-action="checkin-show-fall-form">' + esc(tr('yes')) + '</button>' +
            '<button type="button" class="btn" data-action="checkin-next">' + esc(tr('no')) + '</button>' +
          '</div>';
      }
    } else if (stepId === 'medication') {
      html += '<h2>' + esc(tr('checkinStepMed')) + '</h2>';
      html += '<div class="stack">' +
        '<button type="button" class="btn" data-action="checkin-med" data-value="ok">' + esc(tr('checkinStepMedOk')) + '</button>' +
        '<button type="button" class="btn secondary" data-action="checkin-med" data-value="missed">' + esc(tr('checkinStepMedMissed')) + '</button>' +
        '</div>';
      if (checkin.missedDoses) html += '<p class="status-line warn" style="margin-top:12px;">⚠ ' + esc(tr('checkinMissedAdvice')) + '</p>';
    } else if (stepId === 'height') {
      html += '<h2>' + esc(tr('checkinStepHeight')) + '</h2>';
      html += '<label for="checkinHeight">' + esc(tr('heightCurrent')) + '</label>' +
        '<input type="number" id="checkinHeight" inputmode="decimal" step="0.1" placeholder="cm">' +
        '<div class="btn-row" style="margin-top:12px;">' +
          '<button type="button" class="btn secondary" data-action="checkin-next">' + esc(tr('checkinStepHeightSkip')) + '</button>' +
          '<button type="button" class="btn" data-action="checkin-save-height">' + esc(tr('save')) + '</button>' +
        '</div>';
    } else if (stepId === 'selftest') {
      html += '<h2>' + esc(tr('checkinStepSelfTest')) + '</h2><p class="muted">' + esc(tr('selfTestSafety')) + '</p>';
      html += '<div class="btn-row">' +
        '<button type="button" class="btn secondary" data-action="checkin-next">' + esc(tr('skip')) + '</button>' +
        '<button type="button" class="btn" data-action="checkin-goto-tests">' + esc(tr('checkinStepSelfTestGo')) + '</button>' +
        '</div>';
    } else {
      html += '<h2>✓ ' + esc(tr('checkinDone')) + '</h2><p>' + esc(tr('checkinDoneBody')) + '</p>' +
        '<button type="button" class="btn" data-action="checkin-finish">' + esc(tr('finish')) + '</button>';
    }

    if (stepId !== 'done') {
      html += '<button type="button" class="btn ghost" data-action="checkin-close">' + esc(tr('cancel')) + '</button>';
    }
    return html;
  }

  function completeCheckin() {
    state.monthlyCheckin.lastDate = todayStr();
    checkin.open = false;
    saveState();
    enqueueSyncRecord('checkin', {
      falls: checkin.fallLogged ? 1 : 0,
      missedDoses: checkin.missedDoses ? 1 : 0,
      balanceLevel: state.balance.currentLevel
    });
    checkin.fallLogged = false;
    checkin.missedDoses = false;
    render();
  }

  function logFall(dateStr, injured, cause) {
    state.tracking.falls.push({ date: dateStr || todayStr(), injured: !!injured, cause: cause || '' });
    recomputeBalanceLevel();
    saveState();
    enqueueSyncRecord('falls', { injured: injured ? 1 : 0, cause: cause || '' });
  }

  /* ---------- A2HS ---------- */

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    renderA2hs();
  });

  function renderA2hs() {
    var banner = $('#a2hsBanner');
    var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    if (standalone || state.a2hsDismissed || !deferredInstallPrompt || !state.registered) {
      banner.hidden = true;
      return;
    }
    banner.hidden = false;
    banner.innerHTML = '<p>' + esc(tr('a2hsPrompt')) + '</p><div class="a2hs-actions">' +
      '<button type="button" class="install" data-action="install-a2hs">' + esc(tr('a2hsInstall')) + '</button>' +
      '<button type="button" class="dismiss" data-action="dismiss-a2hs">' + esc(tr('a2hsDismiss')) + '</button></div>';
  }

  /* ---------- timers ---------- */

  function startChairStandTimer() {
    chairStandTimer.running = true;
    chairStandTimer.remaining = 30;
    chairStandTimer.awaitingReps = false;
    chairStandTimer.intervalId = setInterval(function () {
      chairStandTimer.remaining -= 1;
      if (chairStandTimer.remaining <= 0) {
        clearInterval(chairStandTimer.intervalId);
        chairStandTimer.running = false;
        chairStandTimer.remaining = 0;
        chairStandTimer.awaitingReps = true;
        render();
        return;
      }
      updateTimerDisplays();
    }, 1000);
    render();
  }

  function stopChairStandTimer() {
    clearInterval(chairStandTimer.intervalId);
    chairStandTimer.running = false;
    chairStandTimer.awaitingReps = true;
    render();
  }

  function startTugTimer() {
    tugTimer.running = true;
    tugTimer.elapsed = 0;
    var startTime = Date.now();
    tugTimer.intervalId = setInterval(function () {
      tugTimer.elapsed = (Date.now() - startTime) / 1000;
      updateTimerDisplays();
    }, 100);
    render();
  }

  function stopTugTimer() {
    clearInterval(tugTimer.intervalId);
    tugTimer.running = false;
    var seconds = Math.round(tugTimer.elapsed * 10) / 10;
    state.tracking.tugTests.push({ date: todayStr(), seconds: seconds });
    recomputeBalanceLevel();
    saveState();
    enqueueSyncRecord('checkin', { tugSeconds: seconds });
    render();
  }

  function updateTimerDisplays() {
    var chairEl = $('#chairStandDisplay');
    if (chairEl) chairEl.textContent = chairStandTimer.remaining + ' ' + tr('seconds');
    var tugEl = $('#tugDisplay');
    if (tugEl) tugEl.textContent = tugTimer.elapsed.toFixed(1) + ' ' + tr('seconds');
  }

  /* ---------- widget wiring ---------- */

  function wireWidgets() {
    var form = $('#registerForm');
    if (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        handleRegisterSubmit(form);
      });
      var hnUnknown = $('#hnUnknown');
      hnUnknown.addEventListener('change', function () {
        var hnInput = $('#hnInput');
        hnInput.disabled = hnUnknown.checked;
        if (hnUnknown.checked) hnInput.value = '';
      });
    }
    var numberInput = $('#onboardingNumberInput');
    if (numberInput) {
      numberInput.addEventListener('input', function () {
        var q = C.ONBOARDING_QUESTIONS[currentQuestionIndex()];
        state.profile[q.field] = numberInput.value === '' ? undefined : parseFloat(numberInput.value);
        $('#onboardingNextBtn').disabled = numberInput.value === '';
      });
    }
  }

  /* ---------- events ---------- */

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action === 'go-tab') {
      state.activeTab = el.getAttribute('data-tab');
      saveState(); render();

    } else if (action === 'reg-sex') {
      $all('[data-action="reg-sex"]').forEach(function (b) { b.classList.remove('selected'); });
      el.classList.add('selected');
      $('#regSexField').value = el.getAttribute('data-value');

    } else if (action === 'answer') {
      var field = el.getAttribute('data-field');
      var raw = el.getAttribute('data-value');
      state.profile[field] = el.getAttribute('data-type') === 'boolean' ? raw === 'true' : raw;
      if (field === 'priorFragilityFracture' && raw === 'false') delete state.profile.fractureSite;
      if (field === 'tScoreKnown' && raw === 'false') delete state.profile.tScore;
      saveState(); render();

    } else if (action === 'onboarding-next') {
      onboardingIndex = currentQuestionIndex() + 1;
      render();

    } else if (action === 'onboarding-back') {
      var idx = currentQuestionIndex() - 1;
      while (idx >= 0 && !questionApplies(C.ONBOARDING_QUESTIONS[idx])) idx--;
      onboardingIndex = Math.max(0, idx);
      render();

    } else if (action === 'finish-onboarding-review') {
      showingTierResult = false;
      state.activeTab = 'home';
      saveState(); render();

    } else if (action === 'save-med-class') {
      var classId = $('#medClassSelect').value;
      var startDate = $('#medStartDate').value;
      if (classId && startDate) {
        state.medication.classId = classId;
        state.medication.startDate = startDate;
        saveState(); render();
      }

    } else if (action === 'set-med-start') {
      var start = $('#medStartDate').value;
      if (start) { state.medication.startDate = start; saveState(); render(); }

    } else if (action === 'clear-med') {
      state.medication = { classId: null, startDate: null, lastTakenDate: null, adherenceLog: state.medication.adherenceLog };
      saveState(); render();

    } else if (action === 'mark-med-taken') {
      state.medication.lastTakenDate = todayStr();
      state.medication.adherenceLog.push({ date: todayStr() });
      saveState();
      enqueueSyncRecord('adherence', {});
      render();

    } else if (action === 'open-nutrition') {
      openNutrition();

    } else if (action === 'nutrition-next') {
      collectNutritionStep();
      nutrition.step += 1;
      if (nutrition.step === 3) {
        nutrition.result = C.buildNutritionResult(nutrition.draft, state.profile);
      }
      render();

    } else if (action === 'nutrition-back') {
      collectNutritionStep();
      nutrition.step = Math.max(0, nutrition.step - 1);
      render();

    } else if (action === 'nutrition-save') {
      state.nutrition.lastAssessedDate = todayStr();
      state.nutrition.answers = nutrition.draft;
      state.nutrition.result = nutrition.result;
      nutrition.open = false;
      saveState();
      enqueueSyncRecord('nutrition', {
        calciumIntakeMg: nutrition.result.calcium.intakeMg,
        calciumSupplementMg: nutrition.result.calcium.suggestedSupplementMg,
        vitaminDSupplementIu: nutrition.result.vitaminD.suggestedSupplementIu,
        proteinIntakeG: nutrition.result.protein ? nutrition.result.protein.intakeG : ''
      });
      render();

    } else if (action === 'nutrition-close') {
      nutrition.open = false;
      render();

    } else if (action === 'toggle-safety') {
      var itemId = el.getAttribute('data-item-id');
      var pos = state.safety.checkedIds.indexOf(itemId);
      if (pos === -1) state.safety.checkedIds.push(itemId); else state.safety.checkedIds.splice(pos, 1);
      saveState(); render();

    } else if (action === 'save-safety-audit') {
      state.safety.lastAuditDate = todayStr();
      saveState();
      enqueueSyncRecord('checkin', { safetyScore: C.computeSafetyScore(state.safety.checkedIds).score });
      render();

    } else if (action === 'set-fall-injured') {
      $all('[data-action="set-fall-injured"]').forEach(function (b) { b.classList.remove('selected'); });
      el.classList.add('selected');
      $('#fallInjuredField').value = el.getAttribute('data-value');

    } else if (action === 'save-fall') {
      var injured = $('#fallInjuredField').value === 'true';
      logFall($('#fallDate').value, injured, $('#fallCause').value);
      if (injured) state.activeTab = 'alert';
      saveState(); render();

    } else if (action === 'save-height') {
      var cm = parseFloat($('#heightInput').value);
      if (!isNaN(cm) && cm > 0) {
        if (!state.tracking.heightBaseline) state.tracking.heightBaseline = cm;
        state.tracking.heightLogs.push({ date: todayStr(), cm: cm });
        saveState();
        enqueueSyncRecord('checkin', { heightCm: cm });
        render();
      }

    } else if (action === 'start-chairstand') {
      startChairStandTimer();
    } else if (action === 'stop-chairstand') {
      stopChairStandTimer();
    } else if (action === 'save-chairstand') {
      var reps = parseInt($('#chairStandRepsField').value, 10);
      if (!isNaN(reps) && reps >= 0) {
        state.tracking.chairStandTests.push({ date: todayStr(), reps: reps });
        chairStandTimer.awaitingReps = false;
        chairStandTimer.remaining = 30;
        recomputeBalanceLevel();
        saveState();
        enqueueSyncRecord('checkin', { chairStandReps: reps });
        render();
      }
    } else if (action === 'start-tug') {
      startTugTimer();
    } else if (action === 'stop-tug') {
      stopTugTimer();

    } else if (action === 'save-dxa') {
      var dxaDate = $('#dxaDateInput').value;
      if (dxaDate) { state.tracking.dxaLastDate = dxaDate; saveState(); render(); }

    } else if (action === 'open-checkin') {
      checkin = { open: true, steps: buildCheckinSteps(), index: 0, fallLogged: false, missedDoses: false };
      render();

    } else if (action === 'checkin-next') {
      checkin.index = Math.min(checkin.steps.length - 1, checkin.index + 1);
      render();

    } else if (action === 'checkin-close') {
      checkin.open = false;
      render();

    } else if (action === 'checkin-show-fall-form') {
      $('#checkinFallForm').hidden = false;
      $('#checkinFallChoice').hidden = true;

    } else if (action === 'set-checkin-injured') {
      $all('[data-action="set-checkin-injured"]').forEach(function (b) { b.classList.remove('selected'); });
      el.classList.add('selected');
      $('#checkinInjuredField').value = el.getAttribute('data-value');

    } else if (action === 'checkin-save-fall') {
      logFall($('#checkinFallDate').value, $('#checkinInjuredField').value === 'true', $('#checkinFallCause').value);
      checkin.fallLogged = true;
      render();

    } else if (action === 'checkin-med') {
      checkin.missedDoses = el.getAttribute('data-value') === 'missed';
      if (checkin.missedDoses) {
        render();
        setTimeout(function () {
          checkin.index = Math.min(checkin.steps.length - 1, checkin.index + 1);
          render();
        }, 2500);
      } else {
        checkin.index = Math.min(checkin.steps.length - 1, checkin.index + 1);
        render();
      }

    } else if (action === 'checkin-save-height') {
      var checkinCm = parseFloat($('#checkinHeight').value);
      if (!isNaN(checkinCm) && checkinCm > 0) {
        if (!state.tracking.heightBaseline) state.tracking.heightBaseline = checkinCm;
        state.tracking.heightLogs.push({ date: todayStr(), cm: checkinCm });
        saveState();
        enqueueSyncRecord('checkin', { heightCm: checkinCm });
      }
      checkin.index = Math.min(checkin.steps.length - 1, checkin.index + 1);
      render();

    } else if (action === 'checkin-goto-tests') {
      completeCheckin();
      state.activeTab = 'track';
      saveState(); render();

    } else if (action === 'checkin-finish') {
      completeCheckin();

    } else if (action === 'install-a2hs') {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then(function () { deferredInstallPrompt = null; renderA2hs(); });
      }
    } else if (action === 'dismiss-a2hs') {
      state.a2hsDismissed = true;
      saveState(); renderA2hs();
    }
  });

  $('#langToggleBtn').addEventListener('click', function () {
    state.lang = state.lang === 'th' ? 'en' : 'th';
    saveState(); render();
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  render();
  flushSyncQueue();
})();
</script>
</body>
</html>
