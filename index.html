<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<!--
  Only scripts served with the app run (no inline script, no inline event
  handlers), and the only place data can be sent is the Google Apps Script
  backend, whose replies redirect to script.googleusercontent.com. Inline
  styles stay allowed: the interface sets colours and widths with style
  attributes.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c5cab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ดูแลกระดูกพรุน">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>ดูแลกระดูกพรุน — Osteoporosis Care</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f2f6fc;
    --surface: #ffffff;
    --surface-alt: #eaf1fb;
    --text: #10161d;
    --muted: #52606d;
    --border: #d6e0ee;
    --primary: #1c5cab;
    --primary-dark: #104281;
    --primary-light: #cde2fb;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --grid: #e1e6ec;
    --status-good: #0b7a3d;
    --status-mid: #a35a08;
    --status-high: #a3341f;
    --status-unknown: #4f5b6b;
    --good: #0ca30c;
    --warning: #fab219;
    --warning-ink: #7a5200;
    --warning-bg: #fff6e0;
    --serious: #ec835a;
    --critical: #d03b3b;
    --critical-bg: #fdecec;
    --radius: 16px;
    --tap: 48px;
  }
  * { box-sizing: border-box; }
  /* A class that sets display beats the browser's [hidden] rule on
     specificity, which left the install banner showing as an empty strip. */
  [hidden] { display: none !important; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Noto Sans Thai UI', 'Noto Sans Thai', 'Sarabun', -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 19px; line-height: 1.55; -webkit-tap-highlight-color: transparent;
  }
  body { padding-bottom: 88px; }

  /* --- Copy deterrents -------------------------------------------------
     Stops casual copying: text selection, right-click and iOS long-press
     "Save Image", and dragging pictures out. It does NOT protect the
     content - anyone can read the page source or open the image URL
     directly, and screenshots cannot be blocked by any web app. See the
     "What this does and does not do" section in README.md. */
  body {
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  /* Patients must still be able to select and correct what they type. */
  input, textarea, select {
    -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text;
    -webkit-touch-callout: default;
  }
  img, video, svg { -webkit-user-drag: none; user-drag: none; }
  img { pointer-events: none; }

  /* Printing to paper or PDF would carry every word straight back out. */
  @media print {
    body > * { display: none !important; }
    body::after {
      /* Set from JS so the notice follows the language the patient chose;
         CSS cannot read app state on its own. */
      content: var(--print-notice, '');
      display: block; padding: 40px; font-size: 16px;
    }
  }
  h1, h2, h3 { line-height: 1.35; margin: 0 0 8px; }
  h1 { font-size: 1.45rem; }
  h2 { font-size: 1.2rem; }
  h3 { font-size: 1.05rem; }
  p { margin: 0 0 10px; }
  button { font: inherit; }
  a { color: var(--primary-dark); }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .center { text-align: center; }

  header.app-header {
    background: var(--primary); color: #fff; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    padding-top: calc(12px + env(safe-area-inset-top));
  }
  header .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  header .brand svg { width: 38px; height: 38px; flex-shrink: 0; border-radius: 9px; }
  header .header-text { display: flex; flex-direction: column; min-width: 0; }
  header .app-name { font-size: 1.08rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .header-hn { font-size: 0.78rem; opacity: 0.9; white-space: nowrap; }
  .lang-toggle {
    background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 16px;
    border-radius: 999px; min-height: 42px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }

  main.screen { padding: 16px; max-width: 680px; margin: 0 auto; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px;
  }
  .card.accent { border-color: var(--primary); border-width: 2px; background: var(--surface-alt); }
  .card.warn { background: var(--warning-bg); border-color: #f0d497; }
  .card.critical { background: var(--critical-bg); border-color: #f0b9b9; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .card-head .ico { font-size: 1.4rem; line-height: 1; }
  .card-head h2, .card-head h3 { margin: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: var(--tap); padding: 10px 18px; border-radius: 999px; border: 2px solid var(--primary);
    background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; width: 100%;
    text-decoration: none; text-align: center;
  }
  .btn:disabled { opacity: 0.45; }
  .btn.secondary { background: #fff; color: var(--primary-dark); }
  .btn.ghost { background: transparent; color: var(--primary-dark); border-color: transparent; text-decoration: underline; min-height: 40px; }
  .btn.danger { background: var(--critical); border-color: var(--critical); }
  .btn.small { width: auto; min-height: 40px; padding: 6px 14px; font-size: 0.9rem; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-row .btn { flex: 1 1 45%; }
  .stack > * + * { margin-top: 10px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* Two number steppers cannot share a row on a 320px phone - the buttons
     alone take 112px of a 156px column - so stack them there. */
  @media (max-width: 380px) { .field-row { grid-template-columns: 1fr; } }

  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input[type="text"], input[type="tel"], input[type="number"], input[type="date"], select {
    width: 100%; min-height: var(--tap); border: 2px solid var(--border); border-radius: 12px;
    padding: 8px 12px; font-size: 1rem; background: #fff; color: var(--text);
  }
  input:focus, select:focus, button:focus-visible { outline: 3px solid var(--primary-light); outline-offset: 1px; }
  .checkbox-row { display: flex; align-items: flex-start; gap: 12px; margin: 12px 0; }
  .checkbox-row input { width: 28px; height: 28px; flex-shrink: 0; margin-top: 2px; accent-color: var(--primary); }
  .checkbox-row label { margin: 0; font-weight: 500; }
  .field-hint { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .choice-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .choice-btn {
    min-height: var(--tap); padding: 10px 18px; border-radius: 12px; border: 2px solid var(--border);
    background: #fff; cursor: pointer; font-weight: 600; flex: 1 1 40%; color: var(--text);
  }
  .choice-btn.selected { border-color: var(--primary); background: var(--surface-alt); color: var(--primary-dark); }

  nav.tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border);
    display: flex; padding: 4px 0 calc(4px + env(safe-area-inset-bottom)); z-index: 20;
  }
  nav.tab-bar button {
    flex: 1; min-width: 0; background: none; border: none; padding: 6px 1px; height: 58px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 1px; color: var(--muted); font-size: 0.6rem; cursor: pointer; border-radius: 10px; line-height: 1.15;
  }
  nav.tab-bar button .tab-label { text-align: center; word-break: keep-all; }
  nav.tab-bar button.active { color: var(--primary-dark); font-weight: 700; background: var(--surface-alt); }
  nav.tab-bar .tab-icon { font-size: 1.2rem; }

  .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; color: #fff; font-weight: 700; font-size: 0.88rem; }
  .badge.status-good { background: var(--status-good); }
  .badge.status-mid { background: var(--status-mid); }
  .badge.status-high { background: var(--status-high); }
  .badge.status-unknown { background: var(--status-unknown); }
  .status-block { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
  .status-block:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .status-block .basis { color: var(--muted); font-size: 0.82rem; margin: 6px 0 0; }
  .status-block .meaning { margin: 8px 0 0; }
  .status-block .action { background: var(--surface-alt); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .status-block .action strong { display: block; margin-bottom: 4px; }
  .badge.level { background: var(--primary); }
  .badge.soft { background: var(--surface-alt); color: var(--primary-dark); }
  .badge-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .status-line { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .status-line.good { color: #096b09; }
  .status-line.warn { color: var(--warning-ink); }
  .status-line.bad { color: var(--critical); }

  .progress-bar { background: var(--border); border-radius: 999px; height: 14px; overflow: hidden; margin: 8px 0; }
  .progress-bar > div { background: var(--primary); height: 100%; }

  ul.bullets { margin: 8px 0 0; padding-left: 22px; }
  ul.bullets li { margin-bottom: 8px; }
  ul.bullets li:last-child { margin-bottom: 0; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 8px 0; border-bottom: 1px solid var(--border); }
  ul.plain li:last-child { border-bottom: none; }

  .tag { display: inline-block; font-size: 0.78rem; padding: 4px 10px; border-radius: 999px; background: var(--surface-alt); color: var(--primary-dark); margin: 0 6px 6px 0; }

  .overlay {
    position: fixed; inset: 0; background: rgba(16,22,29,0.55); z-index: 40;
    display: flex; align-items: flex-end; justify-content: center; padding: 12px;
    overflow-y: auto;
  }
  .modal {
    background: var(--surface); border-radius: 20px; padding: 20px; width: 100%; max-width: 560px;
    margin: auto 0 0; max-height: 92vh; overflow-y: auto;
  }
  .modal.tall { margin: auto 0; }
  .modal-logo { display: block; width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 14px; }
  .modal-lang { display: flex; justify-content: flex-end; margin-bottom: 4px; }

  .a2hs-banner {
    position: fixed; left: 12px; right: 12px; bottom: 80px; background: var(--primary-dark); color: #fff;
    padding: 12px 14px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; z-index: 25; box-shadow: 0 4px 14px rgba(0,0,0,0.22);
  }
  .a2hs-banner p { margin: 0; font-size: 0.88rem; }
  .a2hs-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .a2hs-actions button { min-height: 40px; padding: 6px 12px; border-radius: 999px; border: none; font-weight: 700; cursor: pointer; }
  .a2hs-actions .install { background: #fff; color: var(--primary-dark); }
  .a2hs-actions .dismiss { background: transparent; color: #fff; text-decoration: underline; }

  .freq-row .name { display: flex; align-items: flex-start; gap: 10px; }
  .freq-ico { font-size: 26px; line-height: 1.2; flex: 0 0 34px; text-align: center; }
  .freq-text { min-width: 0; }
  .freq-food { display: block; font-weight: 600; }
  .freq-serving { display: block; font-size: 0.85rem; color: var(--muted); }
  /* Desktop and large tablet: keep the header row and the tab bar aligned with
     the content column instead of letting them stretch across the window. */
  @media (min-width: 760px) {
    header.app-header,
    nav.tab-bar {
      padding-left: calc((100% - 680px) / 2);
      padding-right: calc((100% - 680px) / 2);
    }
    header.app-header { padding-top: calc(12px + env(safe-area-inset-top)); padding-bottom: 12px; }
  }
  /* Product photos show whole on white: a cropped box hides the drug name. */
  .med-photo { width: 64px; height: 64px; object-fit: contain; background: #fff; border-radius: 12px; flex-shrink: 0; border: 1px solid var(--border); }
  .med-photo-wide { width: 100%; height: 180px; object-fit: contain; background: #fff; border-radius: 12px; display: block; margin-bottom: 10px; border: 1px solid var(--border); }
  /*
   * One frame for every picture and clip. It takes the file's own shape but
   * never grows past --media-max, so a portrait picture on a wide screen shows
   * whole in the middle instead of filling the page.
   */
  :root { --media-max: min(440px, 62vh); }
  .media-frame {
    position: relative; width: 100%; max-height: var(--media-max); margin-bottom: 10px;
    background: var(--surface-alt); border-radius: 12px; overflow: hidden;
  }
  .media-frame .media-el { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .clip-toggle { width: 100%; margin-bottom: 12px; }
  .clip-toggle .when-clip, .clip-toggle[aria-pressed="true"] .when-still { display: none; }
  .clip-toggle[aria-pressed="true"] .when-clip { display: inline; }

  .exercise-card { padding: 0; overflow: hidden; }
  .exercise-head {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--surface-alt); border-bottom: 1px solid var(--border);
  }
  .exercise-head .ex-num {
    flex: 0 0 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.05rem;
  }
  .exercise-head .ex-count { display: block; font-size: 0.8rem; color: var(--muted); }
  .exercise-head h3 { margin: 0; }
  .exercise-body { padding: 14px 16px 6px; }
  .exercise-text p { margin: 0 0 10px; }
  .exercise-text .howto-label { font-weight: 700; color: var(--primary-dark); margin-bottom: 4px; }
  @media (min-width: 700px) {
    .exercise-body.has-media { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; align-items: start; }
    .exercise-body.has-media { --media-max: 420px; }
  }

  .site-card { border-color: var(--primary); border-width: 2px; }
  .site-card .site-name { font-size: 1.15rem; font-weight: 800; color: var(--primary-dark); margin: 0; }
  .site-card .site-url { font-size: 0.85rem; color: var(--muted); word-break: break-all; }
  .site-card .btn { width: 100%; margin: 12px 0 4px; }
  .site-card .link-list a { display: flex; align-items: center; gap: 10px; }
  .site-card .link-list .ico { font-size: 1.3rem; flex: 0 0 28px; text-align: center; }

  .safety-item {
    display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
    padding: 12px; margin-bottom: 8px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--border); background: #fff; color: var(--text); min-height: var(--tap);
  }
  .safety-item .ico { font-size: 1.3rem; line-height: 1.2; flex-shrink: 0; }
  .safety-item .txt { flex: 1; }
  .safety-item .state { font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
  .safety-item.done { background: var(--surface-alt); border-color: var(--primary); }
  .safety-item.done .state { color: var(--primary-dark); }
  .safety-item.todo { border-color: var(--warning); background: var(--warning-bg); }
  .safety-item.todo .state { color: var(--warning-ink); }

  .alert-card { border-radius: var(--radius); padding: 16px; margin-bottom: 14px; border: 2px solid; }
  .alert-card.critical { background: var(--critical-bg); border-color: var(--critical); }
  .alert-card.serious { background: var(--warning-bg); border-color: var(--serious); }
  .alert-card .sev { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 0.82rem; padding: 4px 12px; border-radius: 999px; color: #fff; margin-bottom: 8px; }
  .alert-card.critical .sev { background: var(--critical); }
  .alert-card.serious .sev { background: #b8620f; }
  .alert-card .sign { font-weight: 700; margin-bottom: 6px; }
  .alert-card .action { font-size: 0.95rem; }
  .call-bar { position: sticky; bottom: 92px; display: flex; flex-direction: column; gap: 10px; }

  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .chart-card h3 { margin-bottom: 2px; }
  .chart-latest { font-size: 1.6rem; font-weight: 700; margin: 2px 0 6px; }
  .chart-wrap { overflow-x: auto; }
  svg.chart { display: block; width: 100%; height: auto; }
  svg.chart .grid { stroke: var(--grid); stroke-width: 1; }
  svg.chart .axis-text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  svg.chart .value-label { fill: var(--text); font-size: 13px; font-weight: 700; }
  svg.chart .ref-line { stroke-width: 1.5; }
  svg.chart .ref-text { font-size: 11px; font-weight: 700; }
  details.table-view { margin-top: 8px; }
  details.table-view summary { cursor: pointer; color: var(--primary-dark); font-size: 0.85rem; min-height: 36px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 6px; }
  table.data th, table.data td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }

  .link-list a { display: block; padding: 12px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: var(--text); }
  .link-list a:last-child { border-bottom: none; }
  .link-list .title { color: var(--primary-dark); font-weight: 700; display: block; }
  .link-list .desc { color: var(--muted); font-size: 0.9rem; }

  .error-text { color: var(--critical); font-weight: 600; margin: 8px 0; }
  .timer-display { font-size: 2.6rem; font-weight: 800; text-align: center; margin: 12px 0; color: var(--primary-dark); font-variant-numeric: tabular-nums; }
  .step-dots { display: flex; gap: 6px; margin-bottom: 12px; }
  .step-dots span { height: 6px; flex: 1; border-radius: 3px; background: var(--border); }
  .step-dots span.on { background: var(--primary); }
  .freq-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .freq-row .name { flex: 1; font-size: 0.95rem; }
  .freq-row input { width: 84px; min-height: 44px; text-align: center; }
  .med-card {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    padding: 14px; margin-bottom: 10px; border-radius: 14px; cursor: pointer;
    border: 2px solid var(--border); background: #fff; color: var(--text); min-height: 64px;
  }
  .med-card.selected { border-color: var(--primary); background: var(--surface-alt); }
  .med-card .med-icon { font-size: 2rem; line-height: 1; flex-shrink: 0; }
  .med-card .med-body { flex: 1; }
  .med-card .med-name { font-weight: 700; display: block; }
  .med-card .med-meta { font-size: 0.85rem; color: var(--muted); display: block; }

  .countdown { display: flex; align-items: center; gap: 16px; }
  .countdown svg { width: 108px; height: 108px; flex-shrink: 0; }
  .countdown .ring-track { fill: none; stroke: var(--border); stroke-width: 10; }
  .countdown .ring-value { fill: none; stroke-width: 10; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .countdown .ring-number { font-size: 30px; font-weight: 800; text-anchor: middle; }
  .countdown .ring-unit { font-size: 12px; text-anchor: middle; fill: var(--muted); }
  .countdown .countdown-detail { flex: 1; }

  /* --- Topic separators -------------------------------------------------
     Each tab is a stack of topics. Without a break between them an older
     reader scrolls through one undifferentiated wall of cards. */
  .section-head {
    display: flex; align-items: center; gap: 10px;
    margin: 30px 0 12px; padding-top: 18px; border-top: 3px solid var(--primary-light);
  }
  .section-head:first-of-type { margin-top: 4px; padding-top: 0; border-top: 0; }
  .section-head .sec-ico {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px;
    background: var(--surface-alt); display: flex; align-items: center;
    justify-content: center; font-size: 22px;
  }
  .section-head h2 { margin: 0; font-size: 1.18rem; color: var(--primary-dark); }
  .section-head .sec-sub { display: block; font-size: 0.82rem; font-weight: 400; color: var(--muted); }

  /* --- Easier number entry --------------------------------------------- */
  .stepper { display: flex; align-items: stretch; gap: 8px; }
  .stepper input[type="number"] { flex: 1; min-width: 0; text-align: center; margin: 0; }
  .stepper button {
    flex: 0 0 auto; width: 56px; min-height: var(--tap); font-size: 26px; font-weight: 700;
    padding: 0;
    line-height: 1; border: 2px solid var(--primary); background: var(--surface);
    color: var(--primary); border-radius: 12px; cursor: pointer;
  }
  .stepper button:active { background: var(--primary-light); }

  .quick-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .quick-chip {
    min-height: 44px; padding: 8px 14px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 0.92rem; font-weight: 600;
  }
  .quick-chip:active, .quick-chip.on { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); }
  .field-hint { font-size: 0.85rem; color: var(--muted); margin: 6px 0 0; }

  /* --- Countdown meter for the text-only due dates ---------------------- */
  .due-meter { margin: 10px 0 4px; }

  /* --- Food infographic ------------------------------------------------- */
  .food-graphic { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 4px; }

  .food-row .f-mg { font-weight: 800; font-size: 1.02rem; white-space: nowrap; color: var(--primary-dark); }

  .day-plan { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .day-plan .dp-item {
    flex: 1 1 90px; background: var(--surface-alt); border-radius: 12px; padding: 10px 8px;
    text-align: center; border: 1px solid var(--border);
  }
  .day-plan .dp-ico { font-size: 26px; display: block; }
  .day-plan .dp-label { font-size: 0.8rem; display: block; margin-top: 4px; }
  .day-plan .dp-mg { font-weight: 700; font-size: 0.9rem; color: var(--primary-dark); }
  .day-plan .dp-plus { align-self: center; font-size: 20px; font-weight: 700; color: var(--muted); flex: 0 0 auto; }
  .day-total {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--primary-light); border-radius: 12px; padding: 12px; font-weight: 700;
    color: var(--primary-dark); font-size: 1.05rem;
  }

  .sun-graphic { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 12px 0; }
  .sun-day {
    border-radius: 10px; padding: 8px 2px; text-align: center; min-width: 0;
    border: 2px solid var(--border); background: var(--surface);
  }
  .sun-day.on { background: #fff6e0; border-color: var(--warning); }
  .sun-day .sd-name { display: block; font-size: 0.78rem; color: var(--muted); }
  .sun-day .sd-ico { font-size: 22px; display: block; margin-top: 2px; }

  .icon-list { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 10px; }
  .icon-list li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
  .icon-list .il-ico { font-size: 22px; text-align: center; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 4px 0 8px; font-size: 0.85rem; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .legend i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }

  .delta-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
    background: var(--surface-alt); color: var(--primary-dark); font-weight: 700; font-size: 0.88rem; margin-bottom: 8px;
  }

  .sync-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 0.9rem; }
  .sync-row .label { color: var(--muted); }
  .sync-row .value { font-weight: 600; text-align: right; word-break: break-word; }

  footer.app-footer {
    max-width: 680px; margin: 8px auto 0; padding: 18px 16px 8px; text-align: center;
    border-top: 1px solid var(--border); color: var(--muted); font-size: 0.85rem;
  }
  footer.app-footer .doctor { font-weight: 700; color: var(--text); font-size: 0.95rem; }
  footer.app-footer .sync-reason { font-family: ui-monospace, monospace; font-size: 0.78rem; }
  footer.app-footer .footer-sync { color: var(--warning-ink); background: var(--warning-bg); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
  footer.app-footer .reset-link {
    background: none; border: none; color: var(--muted); text-decoration: underline;
    cursor: pointer; min-height: 44px; font-size: 0.85rem; margin-top: 6px;
  }

  .estimate-banner {
    background: var(--warning-bg); border: 1px solid var(--warning); color: var(--warning-ink);
    border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 700; font-size: 0.9rem;
  }
  .frax-results { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
  .frax-figure { background: var(--surface-alt); border-radius: 12px; padding: 10px 14px; flex: 1 1 45%; }
  .frax-figure .label { display: block; font-size: 0.82rem; color: var(--muted); }
  .frax-figure .figure { font-size: 1.8rem; font-weight: 800; color: var(--primary-dark); }

  .supplement-figure {
    background: var(--surface-alt); border-radius: 12px; padding: 12px 14px; margin-top: 10px;
  }
  .supplement-figure .label { display: block; font-weight: 600; font-size: 0.9rem; color: var(--muted); margin-bottom: 2px; }
  .supplement-figure .figure { font-size: 2.1rem; font-weight: 800; color: var(--primary-dark); line-height: 1.1; }
  .supplement-figure .unit { font-size: 0.95rem; color: var(--text); }
